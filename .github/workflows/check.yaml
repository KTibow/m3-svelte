name: Check TS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        name: PNPM
        with:
          version: latest
          runtime: node@latest
      - name: Run check
        run: pnpm run check
